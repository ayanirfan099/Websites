<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI';
      background: #e3f2fd;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 60px 16px 24px;
      margin: 0;
    }
    .calculator {
      max-width: 100%;
      background: white;
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      text-align: center;
    }
    input, button {
      max-width: 100%;
      font-size: 1.2rem;
      padding: 0.5rem;
      margin: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    #result {
      font-size: 1.5rem;
      color: #007acc;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <a href="index.html" style="position:fixed;top:12px;left:12px;z-index:10;background:white;color:#234;padding:8px;border-radius:6px">All projects</a>
  <div class="calculator">
    <h2>Simple Calculator</h2>
    <input id="num1" aria-label="First number" type="number" step="any" placeholder="First number"> +
    <input id="num2" aria-label="Second number" type="number" step="any" placeholder="Second number">
    <br>
    <button onclick="calculate()">Calculate</button>
    <div id="result" role="status" aria-live="polite"></div>
  </div>
  <script>
    function calculate() {
      const a = parseFloat(document.getElementById('num1').value);
      const b = parseFloat(document.getElementById('num2').value);
      const result = document.getElementById('result');
      if (!Number.isFinite(a) || !Number.isFinite(b) || !Number.isFinite(a + b)) {
        result.textContent = 'Please enter valid numbers.';
        result.style.color = 'red';
      } else {
        result.textContent = `Result: ${a + b}`;
        result.style.color = '#007acc';
      }
    }
  </script>
</body>
</html>

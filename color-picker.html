<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Picker</title>
  <style>
    body {
      font-family: 'Segoe UI';
      background: #fafafa;
      text-align: center;
      padding: 4rem;
    }
    input[type="color"] {
      width: 150px;
      height: 50px;
      border: none;
      cursor: pointer;
    }
    label {
      font-size: 1.2rem;
      display: block;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <a href="index.html" style="position:fixed;top:12px;left:12px;z-index:10;background:white;color:#234;padding:8px;border-radius:6px">All projects</a>
  <h1>Interactive Color Picker</h1>
  <label for="colorPicker">Choose a Background Color:</label>
  <input type="color" id="colorPicker">
  <script>
    document.getElementById('colorPicker').addEventListener('input', function(e) {
      document.body.style.backgroundColor = e.target.value;
    });
  </script>
</body>
</html>
